<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>{{ title }}</h1>
      <section class="card">
        <form id="upload-form">
          <div class="field">
            <label for="text-file">Text file</label>
            <input id="text-file" name="text_file" type="file" accept=".txt" required />
          </div>
          <div class="field">
            <label for="voice-select">Voice</label>
            <select id="voice-select" name="voice"></select>
          </div>
          <div class="field">
            <label for="speed-range">Speed <span id="speed-display">1.0x</span></label>
            <input
              id="speed-range"
              name="speed"
              type="range"
              min="0.5"
              max="2.0"
              step="0.1"
              value="1.0"
            />
          </div>
          <div class="actions">
            <button type="submit">Start synthesis</button>
          </div>
        </form>
      </section>

      <section class="card" id="progress-section" hidden>
        <h2>Job status</h2>
        <div class="progress-bar">
          <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
        <p id="status-text"></p>
        <div id="downloads" hidden>
          <h3>Downloads</h3>
          <a id="audio-link" href="#" download>Download MP3</a>
          <a id="subtitle-link" href="#" download>Download SRT</a>
        </div>
      </section>
    </main>

    <script src="/static/app.js" type="module"></script>
  </body>
</html>
