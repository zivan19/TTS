[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-edge"
version = "0.1.0"
description = "Utilities for working with Edge TTS"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "TTS Maintainers" }
]

[project.scripts]
"tts-edge" = "tts_edge.cli:main"
