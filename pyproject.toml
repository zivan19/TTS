[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
exclude = [
  ".git",
  ".mypy_cache",
  ".ruff_cache",
  "build",
  "dist"
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S", "W", "N"]
ignore = ["ANN101", "ANN102", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
