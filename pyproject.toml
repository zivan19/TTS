[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-edge"
version = "0.1.0"
description = "Self-contained text-to-speech pipeline with a Typer CLI"
authors = [{name = "TTS Team"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.3",
    "rich>=13.0.0",
]

[project.scripts]
"tts-edge" = "tts_edge.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
